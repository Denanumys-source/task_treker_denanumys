<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новий коментар | Task Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#FAFAF9;
            --surface:#fff;
            --border:#E7E5E2;
            --ink:#16181C;
            --muted:#8A8781;
            --accent:#3F3BEA;
            --radius:10px;
            --radius-lg:16px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            font-family:'Inter',sans-serif;
            color:var(--ink);
        }

        header{
            background:var(--surface);
            border-bottom:1px solid var(--border);
            padding:22px 48px;
            display:flex;
            justify-content:space-between;
            align-items:center;
        }

        .logo{
            font-family:'Sora',sans-serif;
            font-size:19px;
            font-weight:600;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo::before{
            content:"";
            width:9px;
            height:9px;
            border-radius:3px;
            background:var(--accent);
        }

        .btn{
            text-decoration:none;
            color:var(--ink);
            border:1px solid var(--border);
            padding:10px 16px;
            border-radius:var(--radius);
            transition:.2s;
        }

        .btn:hover{
            background:var(--bg);
        }

        .container{
            width:90%;
            max-width:760px;
            margin:50px auto;
        }

        .card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:28px;
        }

        h2{
            font-family:'Sora',sans-serif;
            margin-bottom:25px;
            font-size:24px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:1px solid var(--border);
            border-radius:var(--radius);
            font-size:15px;
            font-family:inherit;
        }

        textarea{
            resize:vertical;
            min-height:140px;
        }

        .submit{
            margin-top:15px;
            background:var(--accent);
            color:white;
            border:none;
            padding:12px 22px;
            border-radius:var(--radius);
            cursor:pointer;
            font-size:15px;
            font-weight:600;
        }

        .submit:hover{
            opacity:.9;
        }

    </style>
</head>
<body>

<header>

    <div class="logo">
        Новий коментар
    </div>

    <a href="{% url 'tasks:comment_list' tasks.pk %}" class="btn">
        ← До коментарів
    </a>

</header>

<div class="container">

    <div class="card">

        <h2>Додати коментар</h2>

        <form method="post">
            {% csrf_token %}

            {{ form.as_p }}

            <button class="submit" type="submit">
                Опублікувати
            </button>

        </form>

    </div>

</div>

</body>
</html>
