<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редагування коментаря | Task Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#FAFAF9;
            --surface:#FFFFFF;
            --border:#E7E5E2;
            --ink:#16181C;
            --muted:#8A8781;
            --accent:#3F3BEA;
            --radius:10px;
            --radius-lg:16px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            color:var(--ink);
            font-family:'Inter',sans-serif;
        }

        header{
            background:var(--surface);
            border-bottom:1px solid var(--border);
            padding:22px 48px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:15px;
        }

        .logo{
            font-family:'Sora',sans-serif;
            font-size:19px;
            font-weight:600;
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo::before{
            content:"";
            width:9px;
            height:9px;
            border-radius:3px;
            background:var(--accent);
        }

        .btn{
            text-decoration:none;
            color:var(--ink);
            border:1px solid var(--border);
            background:white;
            padding:10px 16px;
            border-radius:var(--radius);
            transition:.2s;
            font-size:14px;
            cursor:pointer;
        }

        .btn:hover{
            background:var(--bg);
            border-color:var(--ink);
        }

        .container{
            width:90%;
            max-width:760px;
            margin:50px auto;
        }

        .card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:28px;
        }

        h2{
            font-family:'Sora',sans-serif;
            margin-bottom:25px;
            font-size:24px;
        }

        .author{
            font-weight:600;
            margin-bottom:5px;
        }

        .date{
            color:var(--muted);
            font-size:14px;
            margin-bottom:25px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:12px;
            border:1px solid var(--border);
            border-radius:10px;
            font-size:15px;
            font-family:inherit;
        }

        textarea{
            resize:vertical;
            min-height:150px;
        }

        .submit{
            margin-top:15px;
            border:none;
            background:var(--accent);
            color:white;
            padding:12px 22px;
            border-radius:10px;
            cursor:pointer;
            font-weight:600;
            transition:.2s;
        }

        .submit:hover{
            opacity:.9;
        }

        .empty{
            text-align:center;
            padding:70px 20px;
            border:1px dashed var(--border);
            border-radius:16px;
            color:var(--muted);
        }

        @media(max-width:640px){
            header{
                padding:20px;
            }

            .container{
                width:92%;
            }
        }
    </style>
</head>

<body>

<header>

    <div class="logo">
        Редагування коментаря
    </div>

    <a class="btn" href="{% url 'tasks:task_detail' tasks.pk %}">
        ← До завдання
    </a>

</header>

<div class="container">

    {% if com %}

    <div class="card">

        <div class="author">
            {{ com.author }}
        </div>

        <div class="date">
            {{ com.created_at }}
        </div>

        <h2>Редагувати коментар</h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button class="submit" type="submit">
                Зберегти зміни
            </button>

        </form>

    </div>

    {% else %}

    <div class="empty">
        Коментар не знайдено.
    </div>

    {% endif %}

</div>

</body>
</html>
