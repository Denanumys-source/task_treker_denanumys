<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід | Task Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:#FAFAF9;
            --surface:#FFFFFF;
            --border:#E7E5E2;
            --ink:#16181C;
            --muted:#8A8781;
            --accent:#3F3BEA;
            --radius:10px;
            --radius-lg:16px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            font-family:'Inter',sans-serif;
            color:var(--ink);
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:20px;
        }

        .card{
            width:100%;
            max-width:430px;
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:36px;
        }

        h1{
            font-family:'Sora',sans-serif;
            font-size:28px;
            font-weight:600;
            text-align:center;
            margin-bottom:8px;
        }

        .subtitle{
            text-align:center;
            color:var(--muted);
            margin-bottom:30px;
            font-size:14px;
        }

        form p{
            margin-bottom:18px;
        }

        label{
            display:block;
            margin-bottom:8px;
            font-weight:600;
        }

        input{
            width:100%;
            padding:12px;
            border:1px solid var(--border);
            border-radius:var(--radius);
            font-size:15px;
            font-family:inherit;
        }

        input:focus{
            outline:none;
            border-color:var(--accent);
        }

        button{
            width:100%;
            margin-top:10px;
            padding:13px;
            border:none;
            border-radius:var(--radius);
            background:var(--accent);
            color:white;
            font-size:15px;
            font-weight:600;
            cursor:pointer;
            transition:.2s;
        }

        button:hover{
            opacity:.9;
        }

        .register{
            margin-top:25px;
            text-align:center;
            color:var(--muted);
            font-size:14px;
        }

        .register a{
            color:var(--accent);
            text-decoration:none;
            font-weight:600;
        }

        .register a:hover{
            text-decoration:underline;
        }
    </style>

</head>

<body>

{% if messages %}
    {% for message in messages %}
        <script>
            alert("{{ message|escapejs }}");
        </script>
    {% endfor %}
{% endif %}

<div class="card">

    <h1>Вхід</h1>
    <p class="subtitle">
        Увійдіть до свого облікового запису
    </p>

    <form method="post">

        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit">
            Увійти
        </button>

    </form>

    <div class="register">
        Немає акаунта?
        <a href="{% url 'auth_system:register' %}">
            Зареєструватися
        </a>
    </div>

</div>

</body>
</html>
