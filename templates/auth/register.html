
<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Task Tracker</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#f4f6f9;
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            width:420px;
            background:white;
            padding:40px;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.1);
        }

        h1{
            text-align:center;
            color:#2563eb;
            margin-bottom:30px;
        }

        form p{
            margin-bottom:18px;
        }

        input{
            width:100%;
            padding:12px;
            margin-top:6px;
            border:1px solid #d1d5db;
            border-radius:8px;
            font-size:16px;
        }

        input:focus{
            outline:none;
            border-color:#2563eb;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            background:#2563eb;
            color:white;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:.25s;
        }

        button:hover{
            background:#1d4ed8;
        }

        .login{
            text-align:center;
            margin-top:20px;
        }

        .login a{
            color:#2563eb;
            text-decoration:none;
            font-weight:bold;
        }

        .login a:hover{
            text-decoration:underline;
        }

    </style>
</head>

<body>

{% if messages %}
    {% for message in messages %}
        <script>
            alert("{{ message|escapejs }}");
        </script>
    {% endfor %}
{% endif %}

<div class="card">

    <h1>📝 Register</h1>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}

        <button type="submit">
            Create Account
        </button>
    </form>

    <div class="login">
        Already have an account?
        <a href="{% url 'auth_system:login' %}">
            Login
        </a>
    </div>

</div>

</body>
</html>
