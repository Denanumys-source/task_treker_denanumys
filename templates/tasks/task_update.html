<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Task | Task Tracker</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        :root{
            --bg:            #FAFAF9;
            --surface:       #FFFFFF;
            --border:        #E7E5E2;
            --ink:           #16181C;
            --muted:         #8A8781;
            --accent:        #3F3BEA;
            --accent-soft:   #ECEBFD;
            --danger:        #C8503A;
            --danger-soft:   #F7E9E5;
            --success:       #7C9C7A;

            --radius:    10px;
            --radius-lg: 16px;
        }

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{
            background:var(--bg);
            color:var(--ink);
            font-family:'Inter', Helvetica, Arial, sans-serif;
            -webkit-font-smoothing:antialiased;
        }

        h1, .logo{
            font-family:'Sora', 'Inter', sans-serif;
        }

        /* ---------- header ---------- */

        header{
            background:var(--surface);
            border-bottom:1px solid var(--border);
            padding:22px 48px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            flex-wrap:wrap;
            gap:14px;
        }

        .logo{
            font-size:19px;
            font-weight:600;
            letter-spacing:-0.01em;
            color:var(--ink);
            display:flex;
            align-items:center;
            gap:10px;
        }

        .logo::before{
            content:"";
            display:inline-block;
            width:9px;
            height:9px;
            border-radius:3px;
            background:var(--accent);
        }

        .buttons{
            display:flex;
            gap:10px;
            flex-wrap:wrap;
        }

        .btn{
            text-decoration:none;
            background:transparent;
            color:var(--ink);
            border:1px solid var(--border);
            padding:9px 16px;
            border-radius:var(--radius);
            font-size:14px;
            font-weight:500;
            font-family:inherit;
            cursor:pointer;
            transition:border-color .15s ease, background .15s ease;
        }

        .btn:hover{
            border-color:var(--ink);
            background:var(--bg);
        }

        .btn.delete{
            color:var(--danger);
            border-color:var(--danger-soft);
        }

        .btn.delete:hover{
            background:var(--danger-soft);
            border-color:var(--danger);
        }

        /* ---------- layout ---------- */

        .container{
            width:90%;
            max-width:600px;
            margin:0 auto;
            padding:48px 0 80px;
        }

        .card{
            background:var(--surface);
            border:1px solid var(--border);
            border-radius:var(--radius-lg);
            padding:40px;
        }

        h1{
            font-size:24px;
            font-weight:600;
            letter-spacing:-0.02em;
            margin-bottom:28px;
        }

        /* ---------- form ---------- */

        form p{
            margin-bottom:20px;
            display:flex;
            flex-direction:column;
        }

        form label{
            font-size:12px;
            font-weight:600;
            text-transform:uppercase;
            letter-spacing:.06em;
            color:var(--muted);
            margin-bottom:8px;
        }

        input,
        textarea,
        select{
            width:100%;
            padding:11px 14px;
            border:1px solid var(--border);
            border-radius:var(--radius);
            font-size:15px;
            font-family:inherit;
            color:var(--ink);
            background:var(--bg);
            transition:border-color .15s ease, background .15s ease;
        }

        textarea{
            min-height:120px;
            resize:vertical;
        }

        input:focus,
        textarea:focus,
        select:focus{
            outline:none;
            border-color:var(--accent);
            background:var(--surface);
        }

        button{
            width:100%;
            padding:13px;
            border:none;
            border-radius:var(--radius);
            background:var(--ink);
            color:#fff;
            font-size:15px;
            font-weight:600;
            font-family:inherit;
            cursor:pointer;
            transition:background .15s ease;
            margin-top:6px;
        }

        button:hover{
            background:#000;
        }

        /* ---------- responsive ---------- */

        @media (max-width:640px){
            header{
                padding:18px 24px;
            }
            .container{
                width:92%;
                padding:32px 0 60px;
            }
            .card{
                padding:26px;
            }
        }

        /* accessibility */
        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible,
        select:focus-visible{
            outline:2px solid var(--accent);
            outline-offset:2px;
        }

        @media (prefers-reduced-motion: reduce){
            *{
                transition:none !important;
            }
        }
    </style>

</head>

<body>

<header>

    <div class="logo">Task Tracker</div>

    <div class="buttons">

        <a class="btn" href="{% url 'tasks:task_list' %}">
            ← Назад
        </a>

        <a class="btn delete" href="{% url 'tasks:task_delete' tasks.pk %}">
            Видалити
        </a>

    </div>

</header>

<div class="container">

    <div class="card">

        <h1>Редагувати завдання</h1>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Зберегти зміни
            </button>

        </form>

    </div>

</div>

</body>
</html>
