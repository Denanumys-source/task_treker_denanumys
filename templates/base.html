<!DOCTYPE html>
<head>
    <title>Task Tracker</title>
</head>
<body>
<h1>Task Tracker</h1>
{% for t in tasks%}

    <hr style="border: 1px solid black"></hr>
    <a href="{% url 'task_detail' t.pk %}">
    <p>|{{t.creator}}|</p>
    <p>{{t.title}}</p>
    <p>{{t.description}}</p>
    <p>{{t.priority}}</p>
    </a>
    <hr style="border:1px solid black"></hr>
{% empty %}
    <p>Немає доступних Завдань</p>
{% endfor %}
<line></line>
</body>
